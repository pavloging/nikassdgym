version: '3.8'

services:
    server:
        build: ./server
        image: server
        ports:
            - 5000:5000
        restart: always
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '5'

    client:
        build: ./client
        image: client
        ports:
            - 3000:3000
        depends_on:
            - server
        restart: always
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '5'